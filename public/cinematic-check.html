<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Preview verification only</title><style>body{margin:0;background:#333;font:12px system-ui;color:white}header{padding:10px;display:flex;gap:10px;flex-wrap:wrap;align-items:center;position:sticky;top:0;z-index:10;background:#333}button,select{padding:8px}#stage{transform-origin:top left}iframe{border:0;display:block}output{overflow-wrap:anywhere;max-width:100%}</style></head><body><header><label>Width <select id="size"><option>375</option><option>768</option><option selected>1440</option><option>1920</option></select></label><label>Page <select id="route"><option value="/">Home</option><option value="/services">Services</option><option value="/courses">Courses</option><option value="/shop">Shop</option><option value="/gift">Gift</option><option value="/about">About</option><option value="/login">Login</option><option value="/cart">Cart</option><option value="/checkout">Checkout</option><option value="/toorog">Astrology</option></select></label><button id="check">Check</button><button data-section="capabilities">Capabilities</button><button data-section="services">Services section</button><button data-section="zurhai">Astrology section</button><output id="result"></output></header><div id="stage"><iframe id="page" title="Responsive preview" src="/" width="1440" height="950"></iframe></div><script>
const f=document.getElementById('page'),s=document.getElementById('size'),stage=document.getElementById('stage'),out=document.getElementById('result');
function resize(){f.width=s.value;f.height=s.value==='375'?'812':'950';stage.style.width=s.value+'px';stage.style.transform='scale('+Math.min(1,innerWidth/Number(s.value))+')';out.textContent='Viewport '+s.value;}
s.onchange=resize;window.addEventListener('resize',resize);resize();document.getElementById('route').onchange=e=>f.src=e.target.value;
document.getElementById('check').onclick=()=>{const d=f.contentDocument,w=f.contentWindow;out.textContent=JSON.stringify({width:w.innerWidth,document:d.documentElement.scrollWidth,noOverflow:d.documentElement.scrollWidth<=w.innerWidth,theme:!!d.querySelector('[data-cinematic-theme]'),h1:d.querySelector('h1')?.textContent,sections:['services','zurhai','ayalal','shop','gift','about'].filter(id=>d.getElementById(id)),video:[...d.querySelectorAll('.cinema-media video')].map(v=>({ready:v.readyState,paused:v.paused,opacity:v.style.opacity,loop:v.loop,error:v.error?.code})),brokenImages:[...d.images].filter(i=>i.offsetWidth&&i.complete&&!i.naturalWidth).length});};
document.querySelectorAll('[data-section]').forEach(b=>b.onclick=()=>f.contentDocument.getElementById(b.dataset.section)?.scrollIntoView({behavior:'instant'}));
</script></body></html>
