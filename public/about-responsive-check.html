<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="robots" content="noindex"><meta name="viewport" content="width=device-width, initial-scale=1"><title>About responsive QA — preview only</title><style>body{margin:0;background:#dce3e8;font:14px system-ui}header{padding:12px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}button,select{padding:8px}#stage{transform-origin:top left}iframe{border:0;display:block}output{white-space:pre-wrap}</style></head><body><header><label>Viewport <select id="width"><option>375</option><option>768</option><option selected>1440</option><option>1920</option></select></label><button id="measure">Check layout</button><button data-id="our-story">Story</button><button data-id="our-team">Team</button><button data-id="our-program">Program</button><button data-id="contact">Contact</button><output id="result"></output></header><div id="stage"><iframe id="page" title="About page responsive viewport" src="/about" width="1440" height="900"></iframe></div><script>
const frame=document.getElementById('page'), size=document.getElementById('width'), stage=document.getElementById('stage');
function resize(){frame.width=size.value;frame.height=size.value==='375'?'812':'900';const scale=Math.min(1,innerWidth/Number(size.value));stage.style.transform='scale('+scale+')';stage.style.width=size.value+'px';document.getElementById('result').textContent='Viewport '+size.value;}
size.addEventListener('change',resize);addEventListener('resize',resize);resize();
document.getElementById('measure').onclick=()=>{const d=frame.contentDocument,w=frame.contentWindow;document.getElementById('result').textContent=JSON.stringify({width:w.innerWidth,documentWidth:d.documentElement.scrollWidth,noOverflow:d.documentElement.scrollWidth<=w.innerWidth,heading:d.querySelector('h1')?.textContent,storyItems:d.querySelectorAll('#our-story article,#our-story button').length,milestones:d.querySelectorAll('#our-program article').length,programTransform:d.querySelector('[data-track]')?.style.transform,openDialogs:d.querySelectorAll('dialog[open]').length,brokenImages:[...d.images].filter(i=>i.offsetWidth&&i.complete&&!i.naturalWidth).length});};
document.querySelectorAll('[data-id]').forEach(button=>button.onclick=()=>frame.contentDocument.getElementById(button.dataset.id)?.scrollIntoView({behavior:'instant'}));
</script></body></html>
